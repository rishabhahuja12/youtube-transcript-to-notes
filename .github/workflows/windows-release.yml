name: Windows release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      NODE_VERSION: 22.14.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt pyinstaller==6.13.0
      - name: Build PO Token provider from pinned tag
        shell: pwsh
        run: |
          git clone --branch 1.3.1 --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git runtime/bgutil-ytdlp-pot-provider
          Push-Location runtime/bgutil-ytdlp-pot-provider/server
          npm ci
          npm exec -- tsc
          Pop-Location
      - name: Bundle exact Node runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime/node | Out-Null
          Copy-Item (Get-Command node).Source runtime/node/node.exe
      - name: Build frontend
        working-directory: frontend
        run: npm ci; npm run build
      - name: Test backend
        run: pytest -q
      - name: Package release
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Smoke test bundle contents
        shell: pwsh
        run: |
          $bundle = "release/StudySuite-$((Get-Content VERSION.txt).Trim())-windows-x64"
          foreach ($path in @(
            "$bundle/StudySuite.exe",
            "$bundle/runtime/node/node.exe",
            "$bundle/runtime/bgutil-ytdlp-pot-provider/server/build/main.js",
            "$bundle/frontend/dist/index.html"
          )) {
            if (-not (Test-Path $path)) { throw "Missing bundle file: $path" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: StudySuite-windows-x64
          path: release/*
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.sha256
            release/*/release-manifest.json
